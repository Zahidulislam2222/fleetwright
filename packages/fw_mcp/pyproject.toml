[project]
name = "fw-mcp"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fw-core", "mcp==1.28.1"]

[project.scripts]
fleetwright-mcp = "fw_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fw_mcp"
