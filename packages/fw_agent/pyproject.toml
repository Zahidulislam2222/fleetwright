[project]
name = "fw-agent"
version = "0.2.0"
description = "Standalone local browser assistant with exact human approval"
requires-python = ">=3.12,<3.13"
dependencies = ["fw-core", "fastapi==0.142.2", "uvicorn==0.54.0", "httpx==0.28.1", "playwright==1.63.0", "PyYAML==6.0.3"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fw_agent"
