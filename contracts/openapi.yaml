        status:
          enum:
          - healthy
          - draining
          - stale
          - dead
          title: Status
          type: string
        tenant_id:
          title: Tenant Id
          type: string
        version:
          title: Version
          type: string
      required:
      - tenant_id
      - id
      - cell_id
      - mode
      - status
      - account_id
      - contexts
      - memory_mb
      - cpu_pct
      - heartbeat_age_s
      - version
      - started_at
      title: Worker
      type: object
    WorkerPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Worker'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        tenant_id:
          title: Tenant Id
          type: string
        total_estimate:
          title: Total Estimate
          type: integer
      required:
      - tenant_id
      - items
      - next_cursor
      - total_estimate
      title: WorkerPage
      type: object
    WorkerTotals:
      additionalProperties: false
      properties:
        healthy:
          title: Healthy
          type: integer
        total:
          title: Total
          type: integer
      required:
      - total
      - healthy
      title: WorkerTotals
      type: object
info:
  title: Fleetwright API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/accounts:
    get:
      operationId: accounts_v1_accounts_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
          description: Successful Response
      summary: Accounts
  /v1/accounts/{account_id}/otp:
    post:
      description: An operator types the one-time code the target sent; the waiting worker picks it up.
      operationId: manual_otp_v1_accounts__account_id__otp_post
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          format: uuid
          title: Account Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpIn'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Manual Otp
  /v1/audit:
    get:
      operationId: audit_page_v1_audit_get
