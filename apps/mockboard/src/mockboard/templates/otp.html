{% extends "base.html" %}
{% block title %}Enter code{% endblock %}
{% block main %}
<section class="card narrow">
  <h1>Check your email</h1>
  {% if error == "code" %}<p class="error" role="alert">That code is not right. Try again.</p>{% endif %}
  <form method="post" action="/otp" id="otp-form">
    <label for="code">One-time code</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="12">
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
