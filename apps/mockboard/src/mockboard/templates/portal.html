<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Owned Service Portal</title><meta name="csrf" content="{{ csrf }}"><script src="/static/portal.js" defer></script></head>
<body>
<main>
<h1>Service requests</h1>
<p>Owned maintenance portal for authorized service-request workflows.</p>
<form id="request-form">
<label>Reference <input name="reference" required maxlength="80" pattern="[A-Za-z0-9_-]+"></label>
<label>Title <input name="title" required maxlength="120"></label>
<label>Priority <select name="priority"><option value="normal">Normal</option><option value="urgent">Urgent</option></select></label>
<button type="submit">Submit request</button>
</form>
<p id="receipt" role="status" aria-live="polite"></p>
</main>
</body>
</html>
