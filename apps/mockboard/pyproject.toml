[project]
name = "fw-mockboard"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fw-core", "fastapi==0.142.2", "uvicorn==0.54.0", "jinja2==3.1.6", "python-multipart==0.0.32", "argon2-cffi==25.1.0", "aiosmtplib==5.1.3"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mockboard"
