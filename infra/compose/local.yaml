# Local development stack: data services only. Fleetwright's own processes run from the uv
# workspace (see docs/dev/local.md) or from infra/compose/app.yaml.
# Host ports come from .env; every port is bound to 127.0.0.1.
name: fleetwright-local

x-redis: &redis
  image: redis:8.10.2@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
  restart: unless-stopped
  command: ["redis-server", "--save", "", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${FWDEV_PG_SUPERUSER_PASSWORD:?set in .env}
      FWDEV_PG_OWNER_PASSWORD: ${FWDEV_PG_OWNER_PASSWORD:?set in .env}
      FWDEV_PG_APP_PASSWORD: ${FWDEV_PG_APP_PASSWORD:?set in .env}
      FWDEV_PG_WORKER_PASSWORD: ${FWDEV_PG_WORKER_PASSWORD:?set in .env}
      FWDEV_PG_BOARD_PASSWORD: ${FWDEV_PG_BOARD_PASSWORD:?set in .env}
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    ports: ["127.0.0.1:${FWDEV_PG_PORT:?set in .env}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ../postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d fleetwright -tAc 'SELECT 1' | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-core:
    <<: *redis
    ports: ["127.0.0.1:${FWDEV_REDIS_CORE_PORT:?set in .env}:6379"]
  redis-cell-a:
    <<: *redis
    ports: ["127.0.0.1:${FWDEV_REDIS_CELL_A_PORT:?set in .env}:6379"]
  redis-cell-b:
    <<: *redis
    ports: ["127.0.0.1:${FWDEV_REDIS_CELL_B_PORT:?set in .env}:6379"]

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:${FWDEV_SMTP_PORT:?set in .env}:1025"
      - "127.0.0.1:${FWDEV_MAILPIT_PORT:?set in .env}:8025"

volumes:
  pgdata:
