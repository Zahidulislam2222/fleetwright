# GENERATED from deploy/templates/nginx.conf by deploy/build-release.mjs — edit the template.
# Fixed counts: "auto" follows the host's CPUs, not this container's limit, and the stream cap
# below must fit in worker_processes x worker_connections (each stream holds two connections).
worker_processes {{nginxWorkers}};
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections {{nginxConnections}}; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Visitor address. Only Caddy reaches this container (loopback port, edge network), and Caddy
    # always appends the address of the peer that connected to it, so the LAST X-Forwarded-For
    # entry is that peer and cannot be forged. If that peer is Cloudflare, the visitor is in
    # CF-Connecting-IP (set by Cloudflare, which overwrites any client value); otherwise the peer
    # itself is the visitor (a request that bypassed Cloudflare). Earlier X-Forwarded-For entries
    # are never believed, so neither a direct request nor one relayed through a Cloudflare Worker
    # can choose the address used for rate limits, lockouts and the audit log.
    # Headers are only read from connections arriving on the edge network (Caddy, through the
    # loopback port). Containers on the backend network, such as the browser worker, are taken at
    # their own address. Every process on the host reaches the loopback port through the same
    # gateway address as Caddy, so this cannot tell Caddy from another local process.
    geo $remote_addr $from_edge {
        default 0;
        {{edgeSubnet}} 1;
    }
    map "$from_edge|$http_x_forwarded_for" $edge_peer {
        "~^1\|(?:.*[,\s])?(?<peer>[^,\s]+)\s*$" $peer;
        default $remote_addr;
    }
    geo $edge_peer $peer_is_cloudflare {
        default 0;
{{cloudflareGeo}}
    }
    map "$peer_is_cloudflare|$http_cf_connecting_ip" $visitor {
        "~^1\|(?<ip>[0-9a-fA-F:.]+)$" $ip;
        default $edge_peer;
    }
    # Limits count an IPv6 visitor by its /64, the block one subscriber is normally given; counting
    # single addresses would let one connection rotate through millions of them. An address that
    # shortens zeros before its fourth group ("2001:db8::1") is counted by the part before "::",
    # which can only merge more addresses into one count, never split them.
    map $visitor $visitor_key {
        "~*^(?<p>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):" $p;
        "~*^(?<p>[0-9a-f:]*?)::" $p::;
        default $visitor;
    }

    # Docker's resolver, so a restarted api/gateway container is found at its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Per-visitor guards are listed before the shared origin budget in every location, so a visitor
    # over its own limit is turned away before it can spend the budget everyone else shares. The
    # API also locks out by account and by address range.
    limit_req_zone $server_name zone=origin_budget:1m rate=100r/s;
    limit_req_zone $visitor_key zone=static_ip:10m rate={{staticRatePerS}}r/s;
    limit_req_zone $visitor_key zone=signin:4m rate={{signinRatePerMin}}r/m;
    limit_req_zone $visitor_key zone=api_ip:10m rate={{apiRatePerS}}r/s;
    limit_conn_zone $visitor_key zone=streams_ip:4m;
    limit_conn_zone $server_name zone=streams_all:1m;
    map $uri $resource_cache_control {
        default "public, no-cache, no-transform";
        ~^/v1/ "no-store";
        ~^{{immutablePrefix}} "public, max-age=31536000, immutable";
        ~^{{mediaPrefix}} "public, max-age={{mediaMaxAgeS}}";
    }
    map $status $cache_control {
        default "no-store, no-transform";
        ~^(200|206|304)$ $resource_cache_control;
    }
    server {
        listen {{containerPort}};
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        # Canonical URLs: no /index.html, no .html suffix, no trailing slash.
        if ($request_uri ~ ^/index\.html(?:\?.*)?$) { return 308 /$is_args$args; }
        if ($request_uri ~ ^(.+)/index\.html(?:\?.*)?$) { return 308 $1$is_args$args; }
        if ($request_uri ~ ^(/[^?]+)\.html(\?.*)?$) { return 308 $1$2; }
        if ($request_uri ~ ^(.+)/\?(.*)$) { return 308 $1?$2; }
        if ($request_uri ~ ^(.+)/$) { return 308 $1; }
        client_max_body_size 1k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        send_timeout 30s;
        keepalive_timeout 30s;
        limit_req zone=static_ip burst={{staticBurst}} nodelay;
        limit_req zone=origin_budget burst=250 nodelay;
        limit_req_status 429;
        add_header Cache-Control $cache_control always;
{{securityHeaders}}
        error_page 404 /404.html;
        location = {{healthPath}} { access_log off; default_type text/plain; return 200 "{{slug}}-ok\n"; }

        # Live updates: one long-lived response per console tab; never buffered or compressed.
        location = /v1/stream {
            limit_except GET { deny all; }
            # A location's own limit directives replace the server's, so the origin guard is repeated.
            limit_req zone=api_ip burst={{apiBurst}} nodelay;
            limit_req zone=origin_budget burst=250 nodelay;
            limit_conn streams_ip {{streamsPerIp}};
            limit_conn streams_all {{streamsTotal}};
            limit_conn_status 429;
            set $gateway_upstream http://gateway:{{gatewayPort}};
            proxy_pass $gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $visitor;
            proxy_hide_header Cache-Control;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 1h;
            send_timeout 1h;
        }

        location /v1/auth/ {
            limit_req zone=signin burst={{signinBurst}} nodelay;
            limit_req zone=api_ip burst={{apiBurst}} nodelay;
            limit_req zone=origin_budget burst=250 nodelay;
            client_max_body_size {{apiBodyLimit}};
            set $api_upstream http://api:{{apiPort}};
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $visitor;
            proxy_hide_header Cache-Control;
            proxy_read_timeout 30s;
        }

        location /v1/ {
            limit_req zone=api_ip burst={{apiBurst}} nodelay;
            limit_req zone=origin_budget burst=250 nodelay;
            client_max_body_size {{apiBodyLimit}};
            set $api_upstream http://api:{{apiPort}};
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $visitor;
            proxy_hide_header Cache-Control;
            proxy_read_timeout 30s;
        }

        location ~ /\. { return 404; }
        location ~* \.(php|env|sql|bak|log|map|pem|key|ya?ml|toml)$ { return 404; }
        location = /404.html { internal; }
        location = /404 { return 404; }
        location / {
            limit_except GET { deny all; }
            # Inherits the server's static_ip + origin_budget limits (no limit_req of its own).
            try_files $uri $uri.html $uri/index.html =404;
        }
    }
}
