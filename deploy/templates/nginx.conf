# GENERATED from deploy/templates/nginx.conf by deploy/build-release.mjs — edit the template.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Visitor address. Only Caddy reaches this container (loopback port, edge network). Caddy keeps
    # Cloudflare's X-Forwarded-For only for peers in Cloudflare's published ranges and appends its
    # own peer, so walking the header from the right past these trusted hops yields the visitor;
    # a request that bypassed Cloudflare resolves to its real peer. Nothing else is believed.
{{realIpFrom}}
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's resolver, so a restarted api/gateway container is found at its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Aggregate origin guard plus a per-visitor guard on sign-in (the API also locks out by account).
    limit_req_zone $server_name zone=origin_budget:1m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=signin:4m rate={{signinRatePerMin}}r/m;
    limit_req_zone $binary_remote_addr zone=api_ip:10m rate={{apiRatePerS}}r/s;
    limit_conn_zone $binary_remote_addr zone=streams_ip:4m;
    map $uri $resource_cache_control {
        default "public, no-cache, no-transform";
        ~^/v1/ "no-store";
        ~^{{immutablePrefix}} "public, max-age=31536000, immutable";
        ~^{{mediaPrefix}} "public, max-age={{mediaMaxAgeS}}";
    }
    map $status $cache_control {
        default "no-store, no-transform";
        ~^(200|206|304)$ $resource_cache_control;
    }
    server {
        listen {{containerPort}};
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        # Canonical URLs: no /index.html, no .html suffix, no trailing slash.
        if ($request_uri ~ ^/index\.html(?:\?.*)?$) { return 308 /$is_args$args; }
        if ($request_uri ~ ^(.+)/index\.html(?:\?.*)?$) { return 308 $1$is_args$args; }
        if ($request_uri ~ ^(/[^?]+)\.html(\?.*)?$) { return 308 $1$2; }
        if ($request_uri ~ ^(.+)/\?(.*)$) { return 308 $1?$2; }
        if ($request_uri ~ ^(.+)/$) { return 308 $1; }
        client_max_body_size 1k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        send_timeout 30s;
        keepalive_timeout 30s;
        limit_req zone=origin_budget burst=250 nodelay;
        limit_req_status 429;
        add_header Cache-Control $cache_control always;
{{securityHeaders}}
        error_page 404 /404.html;
        location = {{healthPath}} { access_log off; default_type text/plain; return 200 "{{slug}}-ok\n"; }

        # Live updates: one long-lived response per console tab; never buffered or compressed.
        location = /v1/stream {
            limit_except GET { deny all; }
            # A location's own limit directives replace the server's, so the origin guard is repeated.
            limit_req zone=origin_budget burst=250 nodelay;
            limit_conn streams_ip {{streamsPerIp}};
            limit_conn_status 429;
            set $gateway_upstream http://gateway:{{gatewayPort}};
            proxy_pass $gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_hide_header Cache-Control;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 1h;
            send_timeout 1h;
        }

        location /v1/auth/ {
            limit_req zone=origin_budget burst=250 nodelay;
            limit_req zone=api_ip burst={{apiBurst}} nodelay;
            limit_req zone=signin burst={{signinBurst}} nodelay;
            client_max_body_size {{apiBodyLimit}};
            set $api_upstream http://api:{{apiPort}};
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_hide_header Cache-Control;
            proxy_read_timeout 30s;
        }

        location /v1/ {
            limit_req zone=origin_budget burst=250 nodelay;
            limit_req zone=api_ip burst={{apiBurst}} nodelay;
            client_max_body_size {{apiBodyLimit}};
            set $api_upstream http://api:{{apiPort}};
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_hide_header Cache-Control;
            proxy_read_timeout 30s;
        }

        location ~ /\. { return 404; }
        location ~* \.(php|env|sql|bak|log|map|pem|key|ya?ml|toml)$ { return 404; }
        location = /404.html { internal; }
        location = /404 { return 404; }
        location / {
            limit_except GET { deny all; }
            try_files $uri $uri.html $uri/index.html =404;
        }
    }
}
